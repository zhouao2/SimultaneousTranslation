<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同声传译系统 · 管理后台</title>
    <style>
        :root {
            --bg-1: #667eea;
            --bg-2: #764ba2;
            --primary: #667eea;
            --primary-hover: #5a6fd8;
            --primary-soft: #eef0f9;
            --primary-soft-hover: #e2e5f5;
            --ink-1: #1a1a2e;
            --ink-2: #4a4f6a;
            --ink-3: #7a7f99;
            --ink-4: #a4a8c0;
            --line: #eef0f7;
            --line-strong: #e2e5f1;
            --bg-card: #ffffff;
            --bg-soft: #f7f8fc;
            --bg-hover: #f5f7ff;
            --ok: #2ecc71;
            --ok-ink: #1e8e5a;
            --ok-bg: #e8f8f0;
            --warn: #f39c12;
            --warn-ink: #b9770e;
            --warn-bg: #fef5e7;
            --danger: #e74c3c;
            --danger-ink: #c0392b;
            --danger-bg: #fdecea;
            --purple: #8e44ad;
            --purple-bg: #f4ecf7;
            --shadow-sm: 0 2px 6px rgba(36, 36, 78, .04);
            --shadow-md: 0 6px 18px rgba(36, 36, 78, .08);
            --shadow-lg: 0 18px 50px rgba(36, 36, 78, .18);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(255,255,255,.25), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(255,255,255,.18), transparent 60%),
                linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            background-attachment: fixed;
            min-height: 100vh; padding: 36px 18px 56px;
            color: var(--ink-1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== 顶部 Header ========== */
        .header {
            display: inline-flex; align-items: center; gap: 14px;
            margin: 0 auto 26px; padding: 10px 22px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 14px;
            color: #fff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }
        .header-center { text-align: center; width: 100%; }
        .header h1 {
            display: inline-flex; align-items: center; gap: 10px;
            font-size: 18px; font-weight: 600; letter-spacing: 1.5px;
        }
        .header h1 .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 8px;
            background: rgba(255,255,255,.22); font-size: 14px;
        }
        .header p { margin-top: 4px; opacity: .9; font-size: 12.5px; letter-spacing: .3px; }
        .header p a { color: #fff; text-decoration: underline; text-underline-offset: 3px; opacity: .9; }
        .header p a:hover { opacity: 1; }

        /* ========== 登录卡片 ========== */
        .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
        .login-box {
            background: #fff; border-radius: 16px; padding: 36px 32px;
            box-shadow: var(--shadow-lg); width: 380px;
            border: 1px solid rgba(255,255,255,.4);
        }
        .login-box h2 {
            display: flex; align-items: center; gap: 8px;
            font-size: 18px; color: var(--ink-1); margin-bottom: 6px;
        }
        .login-box h2::before {
            content: ""; width: 6px; height: 18px; border-radius: 3px;
            background: linear-gradient(180deg, var(--primary), var(--bg-2));
        }
        .login-box .sub { font-size: 13px; color: var(--ink-3); margin-bottom: 22px; line-height: 1.6; }
        .login-box input {
            width: 100%; padding: 11px 14px;
            border: 1px solid var(--line-strong); border-radius: 9px;
            font-size: 14px; margin-bottom: 14px; outline: none;
            transition: border-color .15s, box-shadow .15s; background: #fff;
        }
        .login-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,.15);
        }
        .login-box .btn { margin-top: 4px; }
        #loginErr { color: var(--danger-ink); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

        /* ========== 主卡片 ========== */
        .board {
            background: var(--bg-card); border-radius: 16px;
            padding: 22px 26px 28px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,.5);
            max-width: 1200px; margin: 0 auto;
        }

        /* ========== 分段式标签页 ========== */
        .tabs {
            display: inline-flex; gap: 4px; background: var(--bg-soft);
            border-radius: 11px; padding: 4px; margin-bottom: 22px;
            border: 1px solid var(--line);
        }
        .tab {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: 8px; cursor: pointer;
            font-size: 13.5px; color: var(--ink-2);
            transition: all .15s; user-select: none;
        }
        .tab:hover { color: var(--ink-1); background: rgba(255,255,255,.6); }
        .tab.active {
            background: linear-gradient(135deg, var(--primary), #5a6fd8);
            color: #fff; font-weight: 600;
            box-shadow: 0 4px 12px rgba(102,126,234,.35);
        }
        .tab .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-4); transition: background .15s;
        }
        .tab.active .dot { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
        .tab.has-badge .count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 18px; height: 18px; padding: 0 5px;
            background: var(--warn-bg); color: var(--warn-ink);
            border-radius: 9px; font-size: 11px; font-weight: 600;
            margin-left: 2px;
        }
        .tab.active .count { background: rgba(255,255,255,.25); color: #fff; }

        .panel { animation: fade .22s ease; }
        @keyframes fade { from { opacity: .3; transform: translateY(2px); } to { opacity: 1; transform: none; } }
        .hidden { display: none !important; }

        /* ========== 表格 ========== */
        .table-wrap {
            border: 1px solid var(--line); border-radius: 12px;
            overflow: hidden; background: #fff;
            box-shadow: var(--shadow-sm);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td {
            text-align: left; padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        th {
            color: var(--ink-3); font-weight: 600;
            background: var(--bg-soft);
            white-space: nowrap; font-size: 12px;
            letter-spacing: .3px; text-transform: uppercase;
            border-bottom-color: var(--line-strong);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--bg-hover); }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        td.muted { color: var(--ink-3); font-size: 12.5px; }
        td.sub { color: var(--ink-3); font-size: 12px; }

        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 18px; border: 1px solid transparent; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 600; color: #fff;
            background: var(--primary);
            transition: background .15s, transform .05s, box-shadow .15s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #b0b0c0; cursor: not-allowed; }
        .btn.sm {
            padding: 5px 11px; font-size: 12px; border-radius: 6px; font-weight: 500;
        }
        .btn.danger { background: var(--danger); } .btn.danger:hover { background: var(--danger-ink); }
        .btn.ok { background: var(--ok); } .btn.ok:hover { background: var(--ok-ink); }
        .btn.ghost {
            background: #fff; color: var(--primary);
            border-color: var(--line-strong);
        }
        .btn.ghost:hover { background: var(--primary-soft); border-color: var(--primary); }
        .btn.icon { padding: 6px 8px; }

        /* ========== 状态标签 ========== */
        .tag {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px 3px 8px; border-radius: 999px;
            font-size: 11.5px; font-weight: 500;
            line-height: 1;
        }
        .tag::before {
            content: ""; width: 6px; height: 6px; border-radius: 50%;
            background: currentColor; opacity: .8;
        }
        .tag.pending { background: var(--warn-bg); color: var(--warn-ink); }
        .tag.approved, .tag.active, .tag.sent { background: var(--ok-bg); color: var(--ok-ink); }
        .tag.rejected, .tag.revoked, .tag.failed { background: var(--danger-bg); color: var(--danger-ink); }
        .tag.exhausted { background: var(--purple-bg); color: var(--purple); }

        /* ========== 空状态 ========== */
        .empty {
            text-align: center; color: var(--ink-4); padding: 44px 20px;
            font-size: 13.5px;
            border: 1px dashed var(--line-strong); border-radius: 12px;
            background: var(--bg-soft);
        }
        .empty .icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border-radius: 50%;
            background: #fff; border: 1px solid var(--line);
            margin-bottom: 10px; font-size: 18px; color: var(--ink-3);
        }
        .code-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13.5px; letter-spacing: 1px; font-weight: 600;
            color: var(--ink-1);
        }
        .quota-bar {
            background: var(--line); border-radius: 999px; height: 6px;
            width: 110px; overflow: hidden;
        }
        .quota-fill {
            height: 100%; background: linear-gradient(90deg, var(--ok), #27ae60);
            border-radius: 999px; transition: width .3s;
        }
        .quota-fill.warn { background: linear-gradient(90deg, var(--warn), #e67e22); }
        .quota-fill.over { background: linear-gradient(90deg, var(--danger), #c0392b); }

        /* ========== 工具条 ========== */
        .toolbar {
            display: flex; gap: 12px; align-items: center;
            margin-bottom: 18px; font-size: 13px; color: var(--ink-3);
            flex-wrap: wrap;
        }
        .toolbar .label { color: var(--ink-3); }
        .toolbar .pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 999px;
            background: var(--primary-soft); color: var(--primary);
            font-size: 12px; font-weight: 500;
        }
        .toolbar select {
            padding: 6px 28px 6px 10px;
            border: 1px solid var(--line-strong); border-radius: 7px;
            font-size: 13px; outline: none; background: #fff; color: var(--ink-1);
            cursor: pointer; transition: border-color .15s;
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%237a7f99' d='M5 6L0 0h10z'/></svg>");
            background-repeat: no-repeat; background-position: right 10px center;
        }
        .toolbar select:focus { border-color: var(--primary); }
        .toolbar .spacer { flex: 1; }

        /* ========== Toast ========== */
        .toast {
            position: fixed; top: 22px; left: 50%; transform: translate(-50%, -8px);
            color: #fff; padding: 11px 22px; border-radius: 10px;
            font-size: 13.5px; z-index: 99;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
            display: flex; align-items: center; gap: 8px;
            opacity: 0; animation: toast-in .25s ease forwards;
        }
        .toast::before {
            content: ""; width: 8px; height: 8px; border-radius: 50%;
            background: var(--ok);
        }
        .toast.err::before { background: #fff; }
        .toast.err { background: var(--danger-ink); }
        @keyframes toast-in { to { opacity: 1; transform: translate(-50%, 0); } }

        .section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 600; margin: 4px 0 12px;
            color: var(--ink-1);
        }
        .section-title::before {
            content: ""; width: 4px; height: 14px; border-radius: 2px;
            background: linear-gradient(180deg, var(--primary), var(--bg-2));
        }
        .subtable { margin-bottom: 28px; }
        .subtable:last-child { margin-bottom: 0; }

        /* 申请人单元格：主名 + 副 email */
        .applicant { line-height: 1.45; }
        .applicant .name { color: var(--ink-1); font-weight: 500; }
        .applicant .email { color: var(--ink-3); font-size: 12px; }

        /* 操作列按钮组 */
        td .btn.sm + .btn.sm { margin-left: 6px; }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .board { padding: 18px 16px 22px; }
            .tabs { display: flex; width: 100%; }
            .tab { flex: 1; justify-content: center; padding: 8px 10px; }
        }
        @media (max-width: 720px) {
            body { padding: 18px 10px 30px; }
            .header { padding: 8px 14px; }
            .header h1 { font-size: 15px; }
            .header p { font-size: 11.5px; }
            .board { padding: 14px 12px 18px; }
            .tabs { width: 100%; justify-content: space-between; }
            .tab { padding: 7px 8px; font-size: 12.5px; gap: 4px; }
            .tab .count { display: none; }
            .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .login-box { width: 100%; max-width: 360px; padding: 28px 22px; }
        }
    </style>

</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginWrap">
    <div class="login-box">
        <h2>管理后台</h2>
        <div class="sub">同声传译系统 · 管理员登录</div>
        <input type="password" id="adminPwd" placeholder="管理员密码" autocomplete="current-password">
        <button class="btn" style="width:100%" onclick="adminLogin()">登 录</button>
        <div id="loginErr"></div>
    </div>
</div>

<!-- 主界面 -->
<div id="adminApp" class="hidden">
    <div class="header">
        <h1><span class="badge">⚙</span>同声传译 · 管理后台</h1>
        <p>申请审批 · 访问码管理 · 用量与成本 &nbsp;·&nbsp; <a href="/">返回首页</a></p>
    </div>
    <div class="board">
        <div class="tabs">
            <div class="tab active has-badge" data-tab="requests" onclick="switchTab('requests')"><span class="dot"></span>使用申请<span class="count" id="tabBadgeRequests">0</span></div>
            <div class="tab" data-tab="codes" onclick="switchTab('codes')"><span class="dot"></span>访问码</div>
            <div class="tab" data-tab="usage" onclick="switchTab('usage')"><span class="dot"></span>用量与成本</div>
            <div class="tab" data-tab="audit" onclick="switchTab('audit')"><span class="dot"></span>审计日志</div>
        </div>

        <!-- 申请 -->
        <div class="panel" id="panel-requests">
            <div class="section-title">待审批申请</div>
            <div id="pendingTable"></div>
            <div class="section-title" style="margin-top:24px;">已处理申请</div>
            <div id="historyTable"></div>
        </div>

        <!-- 访问码 -->
        <div class="panel" id="panel-codes">
            <div class="toolbar">
                <button class="btn sm ghost" onclick="loadCodes()">⟳ 刷新</button>
                <span class="pill">撤销后立即失效</span>
                <span>预计时长仅作参考，不做额度限制</span>
            </div>
            <div id="codesTable"></div>
        </div>

        <!-- 用量 -->
        <div class="panel" id="panel-usage">
            <div class="toolbar">
                统计范围：
                <select id="usageDays" onchange="loadUsage()">
                    <option value="7">近 7 天</option>
                    <option value="30" selected>近 30 天</option>
                    <option value="90">近 90 天</option>
                </select>
                <span id="pricingInfo"></span>
            </div>
            <div class="subtable">
                <div class="section-title">按访问码</div>
                <div id="usageByCode"></div>
            </div>
            <div class="subtable">
                <div class="section-title">按天汇总</div>
                <div id="usageByDay"></div>
            </div>
        </div>

        <!-- 审计 -->
        <div class="panel" id="panel-audit">
            <div id="auditTable"></div>
        </div>
    </div>
</div>

<script>
let TAB = 'requests';

async function api(path, opts) {
    const resp = await fetch(path, opts);
    if (resp.status === 401 && !path.includes('login')) {
        document.getElementById('loginWrap').classList.remove('hidden');
        document.getElementById('adminApp').classList.add('hidden');
        throw new Error('未登录');
    }
    let data = {};
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    return data;
}
async function post(path, body) {
    return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(text, ok = true) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.style.background = ok ? '#24243e' : '#c0392b';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
}
function fmtMin(sec) { return (sec / 60).toFixed(0) + ' 分钟'; }
function fmtDT(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : '-'; }

// ---------- 登录 ----------
async function adminLogin() {
    const pwd = document.getElementById('adminPwd').value;
    try {
        await post('/api/admin/login', {password: pwd});
        enterAdmin();
    } catch (e) {
        document.getElementById('loginErr').textContent = e.message;
    }
}
document.getElementById('adminPwd').addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });

async function enterAdmin() {
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('adminApp').classList.remove('hidden');
    await refreshAll();
}

// ---------- Tab ----------
function switchTab(tab) {
    TAB = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(el => el.classList.add('hidden'));
    document.getElementById('panel-' + tab).classList.remove('hidden');
    refreshAll();
}
async function refreshAll() {
    if (TAB === 'requests') await loadRequests();
    else if (TAB === 'codes') await loadCodes();
    else if (TAB === 'usage') await loadUsage();
    else if (TAB === 'audit') await loadAudit();
}

// ---------- 申请 ----------
async function loadRequests() {
    const data = await api('/api/admin/requests');
    const pending = data.requests.filter(r => r.status === 'pending');
    // 更新 tab 角标
    const badge = document.getElementById('tabBadgeRequests');
    if (badge) {
      badge.textContent = pending.length;
      badge.style.display = pending.length ? '' : 'none';
    }
    const done = data.requests.filter(r => r.status !== 'pending');

    const pHtml = pending.length ? `<table><tr><th>ID</th><th>申请人</th><th>部门</th><th>主题</th><th>使用时间</th><th>时长</th><th>申请时间</th><th>操作</th></tr>
        ${pending.map(r => `<tr>
            <td>${r.id}</td><td><div class="applicant"><div class="name">${esc(r.applicant)}</div><div class="email">${esc(r.email)}</div></div></td>
            <td>${esc(r.department) || '-'}</td><td>${esc(r.topic) || '-'}</td>
            <td>${fmtDT(r.planned_start)}</td><td>${r.planned_duration_min} 分钟</td>
            <td>${fmtDT(r.created_at)}</td>
            <td style="white-space:nowrap;">
                <button class="btn sm ok" onclick="approve(${r.id})">通过</button>
                <button class="btn sm danger" onclick="reject(${r.id})">拒绝</button>
            </td></tr>`).join('')}</table>`
        : '<div class="empty"><div class="icon">✓</div>暂无待审批申请</div>';
    document.getElementById('pendingTable').innerHTML = pHtml;

    const statusTag = {approved: '已通过', rejected: '已拒绝'};
    const dHtml = done.length ? `<table><tr><th>ID</th><th>申请人</th><th>主题</th><th>使用时间</th><th>状态</th><th>处理时间</th><th>备注</th></tr>
        ${done.slice(0, 30).map(r => `<tr>
            <td>${r.id}</td><td>${esc(r.applicant)}</td><td>${esc(r.topic) || '-'}</td>
            <td>${fmtDT(r.planned_start)}</td>
            <td><span class="tag ${r.status}">${statusTag[r.status] || r.status}</span></td>
            <td>${fmtDT(r.reviewed_at)}</td><td>${esc(r.reject_reason) || ''}</td></tr>`).join('')}</table>`
        : '<div class="empty"><div class="icon">📋</div>暂无历史申请</div>';
    document.getElementById('historyTable').innerHTML = dHtml;
}

async function approve(id) {
    if (!confirm(`通过申请 #${id}？将自动生成访问码并邮件通知申请人。`)) return;
    try {
        const r = await post('/api/admin/approve', {request_id: id});
        toast(r.message + (r.code ? `（访问码: ${r.code}）` : ''));
        await loadRequests();
    } catch (e) { toast(e.message, false); }
}
async function reject(id) {
    const reason = prompt('拒绝原因（可留空）：') ?? '';
    try {
        await post('/api/admin/reject', {request_id: id, reason});
        toast('已拒绝');
        await loadRequests();
    } catch (e) { toast(e.message, false); }
}

// ---------- 访问码 ----------
async function loadCodes() {
    const data = await api('/api/admin/codes');
    const html = data.codes.length ? `<table><tr><th>访问码</th><th>申请人</th><th>主题</th><th>状态</th><th>使用时长 / 预计</th><th>生效时间</th><th>邮件</th><th>操作</th></tr>
        ${data.codes.map(c => {
            return `<tr>
            <td class="code-val">${esc(c.code)}</td>
            <td><div class="applicant"><div class="name">${esc(c.applicant)}</div><div class="email">${esc(c.email)}</div></div></td>
            <td>${esc(c.topic) || '-'}</td>
            <td><span class="tag ${c.status}">${{active:'有效', revoked:'已撤销'}[c.status] || c.status}</span></td>
            <td>${fmtMin(c.used_sec)} / 预计 ${c.quota_min} 分钟</td>
            <td>${fmtDT(c.valid_from)} 起</td>
            <td>${c.email_status ? `<span class="tag ${c.email_status}">${{sent:'已发送',failed:'失败'}[c.email_status] || c.email_status}</span>` : '-'}</td>
            <td style="white-space:nowrap;">
                ${c.status === 'active' ? `<button class="btn sm danger" onclick="revokeCode(${c.id})">撤销</button>` : ''}
                <button class="btn sm ghost" onclick="resend(${c.id})">重发邮件</button>
            </td></tr>`;
        }).join('')}</table>`
        : '<div class="empty"><div class="icon">🔑</div>暂无访问码</div>';
    document.getElementById('codesTable').innerHTML = html;
}
async function revokeCode(id) {
    if (!confirm('撤销后该访问码立即失效，确定？')) return;
    try { await post('/api/admin/revoke', {code_id: id}); toast('已撤销'); await loadCodes(); }
    catch (e) { toast(e.message, false); }
}
async function resend(id) {
    try { const r = await post('/api/admin/resend', {code_id: id}); toast(r.email_sent ? '邮件已发送' : '发送失败，请检查 SMTP 配置', r.email_sent); }
    catch (e) { toast(e.message, false); }
}

// ---------- 用量 ----------
async function loadUsage() {
    const days = document.getElementById('usageDays').value;
    const data = await api('/api/admin/usage?days=' + days);
    const p = data.pricing || {};
    const configured = (p.input_audio_per_ktoken || p.output_audio_per_ktoken || p.output_text_per_ktoken);
    document.getElementById('pricingInfo').textContent = configured
        ? `单价（每千 token，${data.currency}）：输入音频 ${p.input_audio_per_ktoken} / 输出音频 ${p.output_audio_per_ktoken} / 输出文本 ${p.output_text_per_ktoken}`
        : '未配置 token 单价（config.json pricing 节），成本列显示为 0';

    const byCode = data.by_code.filter(r => r.session_count > 0 || r.used_sec > 0);
    document.getElementById('usageByCode').innerHTML = byCode.length ? `<table>
        <tr><th>访问码</th><th>申请人</th><th>会话数</th><th>使用时长</th><th>音频时长</th><th>输入音频 token</th><th>输出音频 token</th><th>输出文本 token</th><th>成本(${data.currency})</th></tr>
        ${byCode.map(r => `<tr>
            <td class="code-val">${esc(r.code)}</td><td>${esc(r.applicant)}</td>
            <td>${r.session_count}</td><td>${fmtMin(r.used_sec)}</td>
            <td>${(r.duration_msec / 1000 / 60).toFixed(1)} 分钟</td>
            <td>${(+r.input_audio_tokens).toFixed(0)}</td><td>${(+r.output_audio_tokens).toFixed(0)}</td><td>${(+r.output_text_tokens).toFixed(0)}</td>
            <td>${r.cost.toFixed(2)}</td></tr>`).join('')}</table>`
        : '<div class="empty"><div class="icon">📊</div>所选时间范围内暂无用量</div>';

    document.getElementById('usageByDay').innerHTML = data.by_day.length ? `<table>
        <tr><th>日期</th><th>会话数</th><th>音频时长</th><th>输入音频 token</th><th>输出音频 token</th><th>输出文本 token</th><th>成本(${data.currency})</th></tr>
        ${data.by_day.map(r => `<tr>
            <td>${r.day}</td><td>${r.session_count}</td>
            <td>${(r.duration_msec / 1000 / 60).toFixed(1)} 分钟</td>
            <td>${(+r.input_audio_tokens).toFixed(0)}</td><td>${(+r.output_audio_tokens).toFixed(0)}</td><td>${(+r.output_text_tokens).toFixed(0)}</td>
            <td>${r.cost.toFixed(2)}</td></tr>`).join('')}</table>`
        : '<div class="empty"><div class="icon">📊</div>暂无数据</div>';
}

// ---------- 审计 ----------
async function loadAudit() {
    const data = await api('/api/admin/audit');
    const nameMap = {
        request_submitted: '提交申请', request_approved: '审批通过', request_rejected: '审批拒绝',
        code_revoked: '撤销访问码', code_quota_added: '追加额度', quota_exceeded: '额度用尽',
        session_start: '会话开始', session_end: '会话结束',
        admin_login: '管理员登录', admin_login_failed: '管理员登录失败',
    };
    document.getElementById('auditTable').innerHTML = data.logs.length ? `<table>
        <tr><th>时间</th><th>操作者</th><th>事件</th><th>详情</th></tr>
        ${data.logs.map(l => `<tr>
            <td>${fmtDT(l.ts)}</td><td>${esc(l.actor)}</td>
            <td>${nameMap[l.action] || l.action}</td><td>${esc(l.detail)}</td></tr>`).join('')}</table>`
        : '<div class="empty"><div class="icon">📜</div>暂无日志</div>';
}
