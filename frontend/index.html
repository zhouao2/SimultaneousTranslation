<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>同声传译 · 实时翻译</title>
    <link rel="stylesheet" href="styles.css?v=20260830">
    <!-- Opus 解码库 -->
    <script type="module">
        (async () => {
            try {
                const opusModule = await import('https://cdn.jsdelivr.net/npm/opus-decoder@0.7.0/+esm');
                console.log('Opus 模块导出:', Object.keys(opusModule));
                
                // 尝试不同的导出名称
                const OpusDecoder = opusModule.OpusDecoder || opusModule.default || opusModule;
                window.OpusDecoder = OpusDecoder;
                window.OpusDecoderReady = true;
                console.log('✓ Opus 解码器库已加载');
                console.log('OpusDecoder 类型:', typeof OpusDecoder);
                // 触发自定义事件通知库已加载
                window.dispatchEvent(new Event('opusDecoderReady'));
            } catch (error) {
                console.error('❌ Opus 解码器库加载失败:', error);
                window.OpusDecoderReady = false;
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title-group">
                <h1>同声传译 · 实时翻译系统</h1>
                <div class="header-room-meta" id="headerRoomMeta"></div>
            </div>
            <div class="header-actions">
                <a href="/viewer" target="_blank" class="viewer-link-btn" title="打开本场查看端页面（观众/投影）">查看端 ↗</a>
                <button class="page-fullscreen-btn" id="pageFullscreenBtn" title="网页全屏">
                    <svg class="page-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                    <svg class="page-exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-layout">
            <!-- 左侧控制区域 -->
            <div class="control-section" id="controlSection">
                <div class="control-content" id="controlContent">
            <div class="control-panel">
                <div class="audio-source-selector">
                    <label for="audioSource">音频源:</label>
                    <select id="audioSource" class="audio-source-select">
                        <option value="microphone">麦克风</option>
                        <option value="system">系统音频</option>
                    </select>
                </div>
                    <div class="language-selector">
                        <label for="sourceLanguage">源语言:</label>
                        <select id="sourceLanguage" class="language-select">
                            <option value="zh">中文</option>
                            <option value="en">英语</option>
                            <option value="es">西班牙语</option>
                            <option value="ja">日语</option>
                            <option value="de">德语</option>
                        </select>
                    </div>
                    <div class="language-selector">
                        <label for="targetLanguage">目标语言:</label>
                        <select id="targetLanguage" class="language-select">
                            <option value="en">英语</option>
                            <option value="zh">中文</option>
                            <option value="es">西班牙语</option>
                            <option value="ja">日语</option>
                            <option value="de">德语</option>
                        </select>
                    </div>
                    <div class="tts-playback-toggle">
                        <label for="ttsPlayback" class="toggle-label">
                            <span>语音播放</span>
                            <input type="checkbox" id="ttsPlayback" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <!-- 本场查看端分享卡（房间就绪后显示） -->
                    <div class="share-card hidden" id="viewerShareCard">
                        <div class="share-card-title">用户查看端</div>
                        <div class="share-card-url" id="viewerShareUrl" title="点击复制"></div>
                        <div class="share-card-actions">
                            <button type="button" class="btn btn-share" id="copyViewerLinkBtn">复制链接</button>
                            <button type="button" class="btn btn-share" id="showQrBtn">二维码</button>
                        </div>
                    </div>

                <button id="testMicBtn" class="btn btn-test">测试麦克风</button>
                <button id="startBtn" class="btn btn-primary">开始翻译</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>停止翻译</button>
                                    <!-- 高级设置折叠区域 -->
                    <div class="advanced-settings-collapsible">
                        <button class="collapsible-header" id="advancedSettingsToggle">
                            <span>高级设置</span>
                            <svg class="collapse-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="collapsible-content" id="advancedSettingsContent">
                            <div class="font-size-selector">
                                <label for="fontSize">字体大小: <span id="fontSizeValue">100%</span></label>
                                <input type="range" id="fontSize" class="font-size-slider"
                                       min="50" max="400" step="5" value="100">
                                <div class="font-size-labels">
                                    <span>50%</span>
                                    <span>100%</span>
                                    <span>200%</span>
                                    <span>300%</span>
                                    <span>400%</span>
                                </div>
                            </div>
                            <div class="playback-speed-selector">
                                <label for="playbackSpeed">播放速度: <span id="playbackSpeedValue">1.0x</span></label>
                                <input type="range" id="playbackSpeed" class="playback-speed-slider"
                                       min="0.5" max="2.0" step="0.05" value="1.0">
                                <div class="speed-labels">
                                    <span>0.5x</span>
                                    <span>1.0x</span>
                                    <span>1.5x</span>
                                    <span>2.0x</span>
                                </div>
                            </div>
                            <div class="input-gain-selector">
                                <label for="inputGain">环境音增益: <span id="inputGainValue">100%</span></label>
                                <input type="range" id="inputGain" class="input-gain-slider"
                                       min="10" max="200" step="10" value="100">
                                <div class="gain-labels">
                                    <span>10%</span>
                                    <span>50%</span>
                                    <span>100%</span>
                                    <span>150%</span>
                                    <span>200%</span>
                                </div>
                                <div class="setting-hint">降低增益可减少远处声音的影响</div>
                            </div>
                            <div class="silence-threshold-selector">
                                <label for="silenceThreshold">静音阈值: <span id="silenceThresholdValue">0.4%</span></label>
                                <input type="range" id="silenceThreshold" class="silence-threshold-slider"
                                       min="0.1" max="20" step="0.1" value="0.4">
                                <div class="threshold-labels">
                                    <span>0.1%</span>
                                    <span>5%</span>
                                    <span>10%</span>
                                    <span>20%</span>
                                </div>
                                <div class="setting-hint">提高阈值可过滤远处较小的声音（建议范围：1%-5%）</div>
                            </div>
                            <div class="noise-suppression-toggle">
                                <label for="noiseSuppression" class="toggle-label">
                                    <span>噪音抑制</span>
                                    <input type="checkbox" id="noiseSuppression" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
            </div>
            
            <div class="audio-test-panel" id="audioTestPanel" style="display: none;">
                <h3>麦克风测试</h3>
                <div class="volume-meter">
                    <div class="volume-bar" id="volumeBar"></div>
                    <div class="volume-text" id="volumeText">音量: 0%</div>
                </div>
                <div class="audio-visualizer" id="audioVisualizer"></div>
                <button id="stopTestBtn" class="btn btn-secondary">停止测试</button>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">连接状态:</span>
                    <span class="info-value" id="connectionStatus">未连接</span>
                </div>
                <div class="info-item">
                    <span class="info-label">音频源状态:</span>
                    <span class="info-value" id="micStatus">未启用</span>
                </div>
                <div class="info-item">
                    <span class="info-label">当前音频源:</span>
                    <span class="info-value" id="audioSourceStatus">未选择</span>
                    </div>
                </div>
                </div>
            </div>

            <!-- 右侧文本区域（包含原文和译文） -->
            <div class="text-sections-container">
                <!-- 原文区域 -->
                <div class="text-section" id="sourceTextSection">
                    <div class="translation-box">
                        <div class="translation-box-header">
                            <h2>原文 (ASR)</h2>
                            <button class="fullscreen-btn" id="sourceFullscreenBtn" title="全屏显示">
                                <svg class="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                                </svg>
                                <svg class="exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="text-display" id="sourceText">等待开始...</div>
                    </div>
                </div>

                <!-- 译文区域 -->
                <div class="text-section" id="targetTextSection">
                    <div class="translation-box">
                        <div class="translation-box-header">
                            <h2>译文</h2>
                            <button class="fullscreen-btn" id="targetFullscreenBtn" title="全屏显示">
                                <svg class="fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                                </svg>
                                <svg class="exit-fullscreen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="text-display" id="targetText">等待开始...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="qrcode.min.js?v=20260830"></script>
    <script src="app.js?v=20260831"></script>
</body>
</html>
